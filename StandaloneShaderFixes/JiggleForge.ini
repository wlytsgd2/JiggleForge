[Present]
if $runtimeEnabled != $runtimeEnabledPrevious
    $runtimeNoticeState = $runtimeEnabled
    $runtimeNoticeUntil = time + 2.0
endif

if $runtimeEnabled == 1
    if $runtimeEnabledPrevious == 0
        run = CommandListResetRuntimeState
    endif
    if $initialised == 1
        run = CommandListRuntimeStep
        if $runtimeDiagnosticEnabled == 1
            run = CustomShaderBuildRuntimeDiagnostics
            Resource\ZZMIv1\Text = ref ResourceDiagnosticText
            Resource\ZZMIv1\TextParams = ref ResourceDiagnosticTextParameters
            run = CommandList\ZZMIv1\PrintText
        endif
    endif
    run = CustomShaderResetFramePick
    clear = ResourceNativePick0 0.0
    clear = ResourceNativePickDepth depth 0.0
    run = CommandListComputeDimensions
    if $initialised != 1
        $initFrame = $initFrame + 1
        if $initFrame > 3
            $initialised = 1
        endif
    endif
else if $runtimeEnabledPrevious == 1
    ; Clear stale motion exactly once. Subsequent disabled frames execute no
    ; picking, physics, or calibration work; only the short switch notice may draw.
    run = CommandListResetRuntimeState
endif

if time < $runtimeNoticeUntil
    if $runtimeNoticeState == 1
        Resource\ZZMIv1\Text = ref ResourceRuntimeEnabledText
        Resource\ZZMIv1\TextParams = ref ResourceRuntimeEnabledTextParameters
    else
        Resource\ZZMIv1\Text = ref ResourceRuntimeDisabledText
        Resource\ZZMIv1\TextParams = ref ResourceRuntimeDisabledTextParameters
    endif
    run = CommandList\ZZMIv1\PrintText
endif
post $active = 0
post $activePickPipeline = 0
post $activePickProfile = 0
post $pickPipelineSerial = 0
post $pickPipelineToken = 0
post $roleCompositeSourceReady = 0
$calibrationRoutePreviousFrame = $calibrationRouteThisFrame
$calibrationRouteThisFrame = 0
