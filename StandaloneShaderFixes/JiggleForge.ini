; The game uses two final-composition routes. UI scenes first render the
; character into a separate texture, while world scenes scale the complete
; scene into the presentation target. Both routes rasterise their source UVs
; into a small calibration map. Body picking consumes the preceding frame's
; map, so scene and resolution changes need no persisted/manual offset.
[ShaderOverrideJiggleForgeCalibrationRoleProducer]
hash = 6443f79de027d780
allow_duplicate_hash = true
if $runtimeEnabled == 1
    ResourceRoleCompositeSource = ref o0
    clear = ResourceAutoCalibrationMap 0.0
    $roleCompositeSourceReady = 1
endif

[ShaderOverrideJiggleForgeCalibrationRoleCompositeEDF7]
hash = edf794e6c2599288
allow_duplicate_hash = true
if $runtimeEnabled == 1
    run = CommandListCaptureRoleCalibration
endif

