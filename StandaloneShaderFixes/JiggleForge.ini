post ResourceRoleCompositeCandidate = null
$runtimeEnabledPrevious = $runtimeEnabled

[CommandListComputeDimensions]
local $cursorSourceValid
local $cursorNormX
local $cursorNormY
local $screenModifierScale
if window_width > 0 && window_height > 0
    $screenW = window_width
    $screenH = window_height
else if rt_width > 0 && rt_height > 0
    $screenW = rt_width
    $screenH = rt_height
else if res_width > 0 && res_height > 0
    $screenW = res_width
    $screenH = res_height
else
    $screenW = 1
    $screenH = 1
endif
$cursorSourceValid = 0
if cursor_x >= 0 && cursor_y >= 0 && cursor_x <= 1 && cursor_y <= 1
    $cursorNormX = cursor_x
    $cursorNormY = 1.0 - cursor_y
    $cursorSourceValid = 1
else if cursor_window_x >= 0 && cursor_window_y >= 0 && cursor_window_x <= $screenW && cursor_window_y <= $screenH
    $cursorNormX = cursor_window_x / $screenW
    $cursorNormY = 1.0 - cursor_window_y / $screenH
    $cursorSourceValid = 1
else if window_width == res_width && window_height == res_height && res_width > 0 && res_height > 0 && cursor_screen_x >= 0 && cursor_screen_y >= 0 && cursor_screen_x <= res_width && cursor_screen_y <= res_height
    $cursorNormX = cursor_screen_x / res_width
    $cursorNormY = 1.0 - cursor_screen_y / res_height
    $cursorSourceValid = 1
endif
$screenModifierScale = 1.0
if $screenW > $screenH && $screenH > 0 && $canvasSizeY > 0
    $screenModifierScale = $canvasSizeY / $screenH
endif
if $cursorSourceValid == 1
    $cursorX = $cursorNormX * $screenW * $screenModifierScale
    $cursorY = $cursorNormY * $screenH * $screenModifierScale
endif
$screenW = $screenW * $screenModifierScale
$screenH = $screenH * $screenModifierScale

