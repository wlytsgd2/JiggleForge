; Called by optional compatibility-patched replacement Mods immediately before
; each numeric or auto DrawIndexed command. Priority 3 represents an actually
; executed source draw. Candidates from the same real game Draw share one
; pipeline token, so this exact range can override its pre-Skin fallback pick
; without overriding a closer surface from a different real Draw.
[CommandListPickVisibleRange]
if $runtimeEnabled == 1 && $diagnosticPassThrough == 0 && ($pickRangeCount > 0 || $pickRangeAuto == 1)
    $pickPriority = 3
    $pickUsesBoundState = 1
    run = CommandListResetNativePick
    if $activePickPipeline == 1
        run = CustomShaderPick2621
        run = CustomShaderAccumulatePick
    else if $activePickPipeline == 2
        run = CustomShaderPickC280
        run = CustomShaderAccumulatePick
    endif
    ; The picker unbinds its temporary VS resources on return. Rebind the
    ; deformation state for the source Mod's DrawIndexed that follows.
    vs-t75 = ResourceMotionStates
    vs-t76 = ResourceGroupParameters
    $pickUsesBoundState = 0
endif

; Adapted draws supply a five-record parameter block at cs-t75. Each listed
; StateIndex receives the same validated parameter set.
[CommandListRegisterGroupParameters]
