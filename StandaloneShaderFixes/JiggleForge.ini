; Standalone global world-space jiggle ShaderFix.
; This file does not depend on the replacement-Mod adapter or any source Mod.
namespace = jiggle_forge

; Inline picking is injected into the material pixel shaders that consume the
; world position exported by the two supported body vertex shaders. The
; original material shader still performs all of its normal work. Only the
; fragment at the calibrated cursor pixel appends one pick record, after the
; game's own discard and depth tests have already selected the visible surface.
[ShaderRegexJiggleForgeInlineBodyPick]
shader_model = ps_5_0
temps = jf0 jf1 jf2 jf3 jf4

[ShaderRegexJiggleForgeInlineBodyPick.Pattern]
(?s)dcl_globalFlags (?P<jf_flags>(?![^\n]*forceEarlyDepthStencil)[^\n]+)\n(?P<jf_program>(?!.*\ndcl_[^\n]*(?:t119|t120|u7)\b)(?!.*\ndcl_input_ps[^\n]*\bv(?:9|11|12)\.)(?=.*\ndcl_input_ps[^\n]*\bv2\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv3\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv4\.[xyzw]*w[xyzw]*\n).*?)\nret\n

[ShaderRegexJiggleForgeInlineBodyPick.Pattern.Replace]
dcl_globalFlags ${jf_flags} | forceEarlyDepthStencil\n${jf_program}\nld_indexable(buffer)(float,float,float,float) ${jf0}.xyz, l(0, 0, 0, 0), t119.xyzw\n
ld_indexable(texture1d)(float,float,float,float) ${jf1}.xy, l(95, 0, 0, 0), t120.xyzw\n
  ftou ${jf1}.zw, v9.xxxy\n
lt ${jf0}.z, l(0.500000), ${jf0}.z\n
mul ${jf0}.xy, ${jf0}.xyxx, ${jf1}.xyxx\n
ftou ${jf0}.xy, ${jf0}.xyxx\n
ieq ${jf0}.xy, ${jf0}.xyxx, ${jf1}.zwzz\n
and ${jf0}.x, ${jf0}.y, ${jf0}.x\n
and ${jf0}.x, ${jf0}.x, ${jf0}.z\n
if_nz ${jf0}.x\n
  ld_indexable(texture1d)(float,float,float,float) ${jf3}.xyzw, l(26, 0, 0, 0), t120.xyzw\n
  mov ${jf4}.x, ${jf3}.z\n
  add ${jf4}.y, -v9.z, l(1.000000)\n
  mov ${jf4}.z, ${jf3}.x\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(0,0,0,0), ${jf4}.xyzw\n
  mov ${jf4}.x, v2.w\n
  mov ${jf4}.y, v3.w\n
  mov ${jf4}.z, v4.w\n
  mov ${jf4}.w, l(50.000000)\n
  store_uav_typed u7.xyzw, l(1,1,1,1), ${jf4}.xyzw\n
  mov ${jf4}.xy, l(0, 0, 0, 0)\n
  mov ${jf4}.z, ${jf3}.y\n
  mov ${jf4}.w, ${jf3}.w\n
  store_uav_typed u7.xyzw, l(2,2,2,2), ${jf4}.xyzw\n
  store_uav_typed u7.xyzw, l(3,3,3,3), l(0,0,0,0)\n
  store_uav_typed u7.xyzw, l(4,4,4,4), l(0.333333,0.333333,0.333333,1.000000)\n
  mov ${jf4}.xyz, v2.xyzx\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(5,5,5,5), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v11.xyzx\n
  store_uav_typed u7.xyzw, l(6,6,6,6), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v12.xyzx\n
  store_uav_typed u7.xyzw, l(7,7,7,7), ${jf4}.xyzw\n
endif\n
ret\n

[ShaderRegexJiggleForgeInlineBodyPick.InsertDeclarations]
dcl_resource_buffer (float,float,float,float) t119
dcl_resource_texture1d (float,float,float,float) t120
dcl_uav_typed_buffer (float,float,float,float) u7
dcl_input_ps_siv linear noperspective v9.xyzw, position
dcl_input_ps linear v11.xyz
dcl_input_ps linear v12.xyz

; Some material pixel shaders already consume SV_POSITION.xy for their own
; screen-space work. Reuse that system-value input and expose its unused z/w
; components instead of rejecting the whole shader or declaring a second
; position input.
[ShaderRegexJiggleForgeInlineBodyPickExistingPosition]
shader_model = ps_5_0
temps = jf0 jf1 jf2 jf3 jf4

[ShaderRegexJiggleForgeInlineBodyPickExistingPosition.Pattern]
(?s)dcl_globalFlags (?P<jf_existing_flags>(?![^\n]*forceEarlyDepthStencil)[^\n]+)\n(?P<jf_existing_before>(?!.*\ndcl_[^\n]*(?:t119|t120|u7)\b)(?!.*\ndcl_input_ps[^\n]*\bv(?:11|12)\.)(?=.*\ndcl_input_ps[^\n]*\bv2\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv3\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv4\.[xyzw]*w[xyzw]*\n).*?)\ndcl_input_ps_siv linear noperspective v9\.xy, position\n(?P<jf_existing_after>.*?)\nret\n

[ShaderRegexJiggleForgeInlineBodyPickExistingPosition.Pattern.Replace]
dcl_globalFlags ${jf_existing_flags} | forceEarlyDepthStencil\n${jf_existing_before}\ndcl_input_ps_siv linear noperspective v9.xyzw, position\n${jf_existing_after}\nld_indexable(buffer)(float,float,float,float) ${jf0}.xyz, l(0, 0, 0, 0), t119.xyzw\n
ld_indexable(texture1d)(float,float,float,float) ${jf1}.xy, l(95, 0, 0, 0), t120.xyzw\n
ftou ${jf1}.zw, v9.xxxy\n
lt ${jf0}.z, l(0.500000), ${jf0}.z\n
mul ${jf0}.xy, ${jf0}.xyxx, ${jf1}.xyxx\n
ftou ${jf0}.xy, ${jf0}.xyxx\n
ieq ${jf0}.xy, ${jf0}.xyxx, ${jf1}.zwzz\n
and ${jf0}.x, ${jf0}.y, ${jf0}.x\n
and ${jf0}.x, ${jf0}.x, ${jf0}.z\n
if_nz ${jf0}.x\n
  ld_indexable(texture1d)(float,float,float,float) ${jf3}.xyzw, l(26, 0, 0, 0), t120.xyzw\n
  mov ${jf4}.x, ${jf3}.z\n
  add ${jf4}.y, -v9.z, l(1.000000)\n
  mov ${jf4}.z, ${jf3}.x\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(0,0,0,0), ${jf4}.xyzw\n
  mov ${jf4}.x, v2.w\n
  mov ${jf4}.y, v3.w\n
  mov ${jf4}.z, v4.w\n
  mov ${jf4}.w, l(50.000000)\n
  store_uav_typed u7.xyzw, l(1,1,1,1), ${jf4}.xyzw\n
  mov ${jf4}.xy, l(0, 0, 0, 0)\n
  mov ${jf4}.z, ${jf3}.y\n
  mov ${jf4}.w, ${jf3}.w\n
  store_uav_typed u7.xyzw, l(2,2,2,2), ${jf4}.xyzw\n
  store_uav_typed u7.xyzw, l(3,3,3,3), l(0,0,0,0)\n
  store_uav_typed u7.xyzw, l(4,4,4,4), l(0.333333,0.333333,0.333333,1.000000)\n
  mov ${jf4}.xyz, v2.xyzx\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(5,5,5,5), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v11.xyzx\n
  store_uav_typed u7.xyzw, l(6,6,6,6), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v12.xyzx\n
  store_uav_typed u7.xyzw, l(7,7,7,7), ${jf4}.xyzw\n
endif\n
ret\n

