; A compact normalized screen-to-source UV map captured from the preceding
; frame's final composition draw. Replaying only the caller's six-index
; composition quad keeps this inexpensive while avoiding fragile 1x1 picks.
[ResourceAutoCalibrationMap]
type = Texture2D
width = 320
height = 180
mips = 1
array = 1
msaa = 1
msaa_quality = 0
format = DXGI_FORMAT_R32G32B32A32_FLOAT
bind_flags = render_target shader_resource

; A reference to the current frame's independently rendered role texture.
[ResourceRoleCompositeSource]

; A reference to the current 857 UI draw's source texture.
[ResourceRoleCompositeCandidate]

; One-record result of the GPU-side role-texture fingerprint comparison.
[ResourceRoleCompositeMatch]
type = RWBuffer
format = R32_UINT
array = 1
bind_flags = unordered_access shader_resource

; Raw copy of the shared UI vertex buffer used by the selected role quad.
[ResourceRoleCompositeVB]
type = RWByteAddressBuffer
format = DXGI_FORMAT_R32_TYPELESS

[CommandListCaptureRoleCalibration]
local $back_x94 = x94
local $back_y94 = y94
clear = ResourceAutoCalibrationMap 0.0
x94 = first_vertex
y94 = vb0->stride
ResourceRoleCompositeVB = copy vb0
run = CustomShaderCaptureRoleCalibrationMap
x94 = $back_x94
y94 = $back_y94
$calibrationRouteThisFrame = 30

[CommandListCaptureFilteredRoleCalibration]
ResourceRoleCompositeCandidate = ref ps-t0
run = CustomShaderCompareRoleComposite
run = CustomShaderCaptureFilteredRoleCalibrationMap
$calibrationRouteThisFrame = 30

[CommandListCaptureWorldCalibration]
clear = ResourceAutoCalibrationMap 0.0
run = CustomShaderCaptureWorldCalibrationMap
$calibrationRouteThisFrame = 10

[CustomShaderCaptureRoleCalibrationMap]
vs = ./JiggleForge/modules/capture_role_composite_raw_vs.hlsl
gs = null
ps = ./JiggleForge/modules/capture_role_composite_uv_ps.hlsl
depth_enable = 0
cull = none
scissor_enable = 0
rasterizer_state_merge = true
run = BuiltInCommandListUnbindAllRenderTargets
vs-t110 = ResourceRoleCompositeVB
o0 = set_viewport no_view_cache ResourceAutoCalibrationMap
draw = 6, 0
post vs-t110 = null

[CustomShaderCaptureFilteredRoleCalibrationMap]
gs = null
ps = ./JiggleForge/modules/capture_filtered_role_composite_uv_ps.hlsl
depth_enable = 0
cull = none
scissor_enable = 0
rasterizer_state_merge = true
run = BuiltInCommandListUnbindAllRenderTargets
ps-t111 = ResourceRoleCompositeMatch
o0 = set_viewport no_view_cache ResourceAutoCalibrationMap
draw = from_caller
