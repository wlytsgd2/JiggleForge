  mov ${jf0}.w, ${jf4}.w\n
  store_uav_typed u7.xyzw, l(9,9,9,9), ${jf0}.xyzw\n
  ld_indexable(texture1d)(float,float,float,float) ${jf4}.xyzw, l(113,0,0,0), t120.xyzw\n
  store_uav_typed u7.xyzw, l(10,10,10,10), ${jf4}.xyzw\n
  ld_indexable(texture1d)(float,float,float,float) ${jf4}.xyzw, l(118,0,0,0), t120.xyzw\n
  store_uav_typed u7.xyzw, l(11,11,11,11), ${jf4}.xyzw\n
