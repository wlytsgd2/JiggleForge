; Standalone global world-space jiggle ShaderFix.
; This file does not depend on the replacement-Mod adapter or any source Mod.
namespace = jiggle_forge

; Inline picking is injected into the material pixel shaders that consume the
; world position exported by the two supported body vertex shaders. The
; original material shader still performs all of its normal work. Only the
; fragment at the calibrated cursor pixel appends one pick record, after the
; game's own discard and depth tests have already selected the visible surface.
; t120 is the standard Texture1D IniParams register and may already have been
; declared by another framework such as RabbitFX. 3DMigoto de-duplicates an
; identical InsertDeclarations entry, so only JiggleForge-private t119/u7 are
; used as the already-injected guard.
; Do not patch screen-space ordered-dither discard programs. Forcing early
; depth on their fading fragments can commit depth before the original discard.
; Recognise table-threshold subtraction followed by compare/discard, not a PS
; hash or a blanket ban on ordinary alpha-test discard. Opacity can already be
; computed (add) or be evaluated here (mad), and coordinate calculation can be
; hoisted out of the discard branch by the compiler.
[ShaderRegexJiggleForgeInlineBodyPick]
shader_model = ps_5_0
temps = jf0 jf1 jf2 jf3 jf4

[ShaderRegexJiggleForgeInlineBodyPick.Pattern]
(?s)dcl_globalFlags (?P<jf_flags>(?![^\n]*forceEarlyDepthStencil)[^\n]+)\n(?!.*\n[ \t]*(?:add|mad) (?P<jf_dither_test>r\d+\.[xyzw]), [^\n]*-icb\[[^\]\n]+\]\.[xyzw][^\n]*\n[ \t]*lt \k<jf_dither_test>, \k<jf_dither_test>, l\((?:0(?:\.0+)?|0x0+)\)\n[ \t]*discard_nz \k<jf_dither_test>[ \t]*(?:\n|$))(?P<jf_program>(?!.*\ndcl_[^\n]*(?:t118|t119|u7)\b)(?!.*\ndcl_input_ps[^\n]*\bv(?:9|11|12)\.)(?=.*\ndcl_input_ps[^\n]*\bv2\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv3\.[xyzw]*w[xyzw]*\n)(?=.*\ndcl_input_ps[^\n]*\bv4\.[xyzw]*w[xyzw]*\n).*?)\nret\n

[ShaderRegexJiggleForgeInlineBodyPick.Pattern.Replace]
dcl_globalFlags ${jf_flags} | forceEarlyDepthStencil\n${jf_program}\nld_indexable(texture1d)(float,float,float,float) ${jf2}.xyzw, l(112, 0, 0, 0), t120.xyzw\n
ge ${jf2}.y, ${jf2}.x, l(0.500000)\n
retc_nz ${jf2}.y\n
ld_indexable(texture1d)(float,float,float,float) ${jf0}.xyzw, l(116,0,0,0), t120.xyzw\n
ge ${jf0}.x, ${jf0}.x, l(0.500000)\n
lt ${jf0}.y, ${jf0}.y, l(0.500000)\n
and ${jf0}.x, ${jf0}.x, ${jf0}.y\n
retc_nz ${jf0}.x\n
lt ${jf2}.x, ${jf2}.z, l(0.500000)\n
ld_indexable(buffer)(float,float,float,float) ${jf0}.xyz, l(0, 0, 0, 0), t119.xyzw\n
ld_indexable(texture1d)(float,float,float,float) ${jf1}.xy, l(95, 0, 0, 0), t120.xyzw\n
  ftou ${jf1}.zw, v9.xxxy\n
lt ${jf0}.z, l(0.500000), ${jf0}.z\n
mul ${jf0}.xy, ${jf0}.xyxx, ${jf1}.xyxx\n
ftou ${jf0}.xy, ${jf0}.xyxx\n
ieq ${jf0}.xy, ${jf0}.xyxx, ${jf1}.zwzz\n
and ${jf0}.x, ${jf0}.y, ${jf0}.x\n
and ${jf0}.x, ${jf0}.x, ${jf0}.z\n
if_nz ${jf0}.x\n
  if_nz ${jf2}.x\n
  ld_indexable(texture1d)(float,float,float,float) ${jf3}.xyzw, l(26, 0, 0, 0), t120.xyzw\n
  mov ${jf4}.x, ${jf3}.z\n
  add ${jf4}.y, -v9.z, l(1.000000)\n
  mov ${jf4}.z, ${jf3}.x\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(0,0,0,0), ${jf4}.xyzw\n
  mov ${jf4}.x, v2.w\n
  mov ${jf4}.y, v3.w\n
  mov ${jf4}.z, v4.w\n
  mov ${jf4}.w, l(50.000000)\n
  store_uav_typed u7.xyzw, l(1,1,1,1), ${jf4}.xyzw\n
  mov ${jf4}.xy, l(0, 0, 0, 0)\n
  mov ${jf4}.z, ${jf3}.y\n
  mov ${jf4}.w, ${jf3}.w\n
  store_uav_typed u7.xyzw, l(2,2,2,2), ${jf4}.xyzw\n
  store_uav_typed u7.xyzw, l(3,3,3,3), l(0,0,0,0)\n
  store_uav_typed u7.xyzw, l(4,4,4,4), l(0.333333,0.333333,0.333333,1.000000)\n
  mov ${jf4}.xyz, v2.xyzx\n
  mov ${jf4}.w, l(1.000000)\n
  store_uav_typed u7.xyzw, l(5,5,5,5), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v11.xyzx\n
  store_uav_typed u7.xyzw, l(6,6,6,6), ${jf4}.xyzw\n
  mov ${jf4}.xyz, v12.xyzx\n
  store_uav_typed u7.xyzw, l(7,7,7,7), ${jf4}.xyzw\n
  ld_indexable(buffer)(uint,uint,uint,uint) ${jf4}.xyzw, l(0,0,0,0), t118.xyzw\n
  and ${jf3}.xyzw, ${jf4}.xyzw, l(65535,65535,65535,65535)\n
  ushr ${jf4}.xyzw, ${jf4}.xyzw, l(16,16,16,16)\n
  utof ${jf3}.xyzw, ${jf3}.xyzw\n
  utof ${jf4}.xyzw, ${jf4}.xyzw\n
  mov ${jf0}.x, ${jf3}.x\n
  mov ${jf0}.y, ${jf4}.x\n
  mov ${jf0}.z, ${jf3}.y\n
  mov ${jf0}.w, ${jf4}.y\n
  store_uav_typed u7.xyzw, l(8,8,8,8), ${jf0}.xyzw\n
  mov ${jf0}.x, ${jf3}.z\n
