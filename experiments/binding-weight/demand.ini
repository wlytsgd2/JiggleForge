; Input policy is sampled once at Present, not independently by each Draw.
; x116 enables this experimental policy; y/z are pick/motion, w is fade gain.
[Constants]
x116 = 1
y116 = 0
z116 = 0
w116 = 0
x117 = 0
y117 = 0
global $demandAwake = 0
global $demandPickActive = 0
global $demandMotionActive = 0
global $demandHasMotion = 0
global $demandGain = 0
global $demandRequested = 0
global $demandDragHeld = 0
global $demandNeedsRelease = 0
global $demandWarmFrames = 0
global $demandRetryFrames = 0
global $demandWasHeld = 0
global $demandSession = 0
[PoolDemandProjectSession]
pool_size = 1024
pool_index_type = fifo
pool_variable_default_value = -1

[CommandListDemandSchedule]
local $oldAwake = $demandAwake
local $oldPick = $demandPickActive
$demandRequested = 0
if $runtimeEnabled == 1
    if cursor_showing && cursor_x >= 0 && cursor_x <= 1 && cursor_y >= 0 && cursor_y <= 1
        $demandRequested = 1
    endif
endif
; Keep physical keys separate from input permitted to reach physics.
; A combat click or held key must never wake the runtime.
$demandDragHeld = 0
if $mouseDown == 0
    $demandNeedsRelease = 0
else if $demandRequested == 0
    $demandNeedsRelease = 1
else if $demandNeedsRelease == 0
    $demandDragHeld = 1
endif
$demandPickActive = $demandRequested
$demandGain = 0
$demandAwake = 0
if $demandRequested == 1
    $demandAwake = 1
    $demandGain = 1
    if $demandDragHeld == 1
        $demandHasMotion = 1
    endif
endif
$demandMotionActive = 0
if $demandAwake == 1 && $demandHasMotion == 1
    $demandMotionActive = 1
endif
if $demandAwake == 1 && $oldAwake == 0
    $demandSession = $demandSession + 1
    $runtimeLastTime = 0
endif
if $demandPickActive == 1 && $oldPick == 0
    ; The frame just drawn used sleeping/old calibration settings. Never freeze it.
    run = CommandListDemandClearPick
    $demandWarmFrames = 2
else if $demandWarmFrames > 0
    $demandWarmFrames = $demandWarmFrames - 1
endif
if $demandDragHeld == 1 && ($demandWasHeld == 0 || $oldAwake == 0)
    $demandRetryFrames = 12
else if $demandRetryFrames > 0
    $demandRetryFrames = $demandRetryFrames - 1
endif
if $demandDragHeld == 0
    $demandRetryFrames = 0
endif
$demandWasHeld = $demandDragHeld
if $demandAwake == 0
    $demandHasMotion = 0
    $demandRetryFrames = 0
    $demandWarmFrames = 0
    if $oldAwake == 1
        run = CommandListDemandSleep
    endif
endif
x116 = 1
y116 = $demandPickActive
z116 = $demandMotionActive
w116 = $demandGain
x117 = $demandRetryFrames
y117 = $demandWarmFrames

[CommandListDemandClearPick]
clear = ResourceFramePick 0.0
clear = ResourceInlineCursor 0.0
clear = ResourceAutoCalibrationMap 0.0
$roleCompositeSourceReady = 0
$calibrationRouteThisFrame = 0
$calibrationRoutePreviousFrame = 0
ResourceRoleCompositeSource = null
ResourceRoleCompositeCandidate = null

[CommandListDemandSleep]
; Visibility loss cancels rather than synthesizing a release/tap. Input and
; motion dispatches are skipped; clearing the frozen pick prevents late taps.
run = CommandListDemandClearPick
clear = ResourceCapturedPick 0.0
clear = ResourceBindingCaptures 0.0
clear = ResourceMotionStates 0.0
; Preserve InputController's generation counter across sleep. New captures must
; never reuse a generation still present in an invisible project's old state.
PoolBindingBlend[*] = null
PoolBindingTyped[*] = null
$PoolBindingMode[*] = null
$PoolBindingFrame[*] = null
$PoolBindingResolveFrame[*] = null
ResourceBindingPositions = null
ResourceBindingTypedPositions = null
ResourceBindingStructuredPositions = null
$bindingResolveFrames = 0
$bindingWasHeld = 0
$runtimeLastTime = 0
; Only original SO/Blend references remain, for frames that skip skinning.

