; Observe r5's rejected paths, do not widen its accepted layouts/draw types.
[Constants]
global $bindingDiagnosticEnabled = 1
global $diagSkin1 = 0
global $diagSkin3 = 0
global $diagSkinGood = 0
global $diagSkinBad = 0
global $diagSkinCandidate = 0

[PoolBindingDiagnosticSkinType]
pool_size = 1024
pool_index_type = fifo

[PoolBindingDiagnosticSkinReason]
pool_size = 1024
pool_index_type = fifo

[ResourceBindingDiagnosticSkinSO]

[ShaderOverrideBindingDiagnosticSkin]
hash = e8425f64cfb887cd
allow_duplicate_hash = true
if $runtimeEnabled == 1 && $demandAwake == 1 && $bindingDiagnosticEnabled == 1 && (DRAW_TYPE == 1 || DRAW_TYPE == 3)
    ResourceBindingDiagnosticSkinSO = ref so0
    $diagSkinCandidate = DRAW_TYPE
    if DRAW_TYPE == 1
        $diagSkin1 = $diagSkin1 + 1
    else
        $diagSkin3 = $diagSkin3 + 1
    endif
endif
post run = CommandListBindingDiagnosticEndSkin

[CommandListBindingDiagnosticEndSkin]
if $diagSkinCandidate > 0
    local $key = @ResourceBindingDiagnosticSkinSO
    local $reason = 1
    if $diagSkinCandidate == 3
        $reason = 31
    else if $key == 0
        $reason = 30
    else if vb0->Stride != 40
        $reason = 32
    else if vb2->Stride != 32
        $reason = 33
    else if vb0->Offset != 0 || vb2->Offset != 0
        $reason = 34
    else if vb0->Size * 32 != vb2->Size * 40
        $reason = 35
    else if ResourceBindingDiagnosticSkinSO->Size < vb0->Size
        $reason = 36
    endif
    if $key
        $PoolBindingDiagnosticSkinType[$key] = $diagSkinCandidate
        $PoolBindingDiagnosticSkinReason[$key] = $reason
    endif
    if $reason == 1
        $diagSkinGood = $diagSkinGood + 1
    else
        $diagSkinBad = $diagSkinBad + 1
    endif
endif
$diagSkinCandidate = 0
ResourceBindingDiagnosticSkinSO = null

[ResourceBindingDiagnosticCapture]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 4
bind_flags = unordered_access shader_resource

[ResourceBindingDiagnosticScan]
type = RWBuffer
format = R32_UINT
array = 32
bind_flags = unordered_access shader_resource

[ResourceBindingDiagnosticText]
type = RWBuffer
format = R32_UINT
array = 768
bind_flags = unordered_access shader_resource

[ResourceBindingDiagnosticTextParameters]
type = StructuredBuffer
array = 1
data = R32_FLOAT -0.98 0.95 0.24 0.28 1.00 0.92 0.40 1.00 0.00 0.00 0.00 0.80 0.01 0.01 1 1 0 0.85

[CustomShaderBindingDiagnosticText]
cs = ./JiggleForge/runtime/binding_diagnostic_text_cs.hlsl
local $back_x121 = x121
local $back_y121 = y121
local $back_z121 = z121
local $back_w121 = w121
x121 = $diagSkin1
y121 = $diagSkin3
z121 = $diagSkinGood
w121 = $diagSkinBad
cs-t0 = ResourceFramePick
cs-t1 = ResourceInputController
cs-t2 = ResourceCapturedPick
cs-t3 = ResourceBindingCaptures
cs-t4 = ResourceBindingDiagnosticCapture
cs-t5 = ResourceBindingDiagnosticScan
cs-t6 = ResourceInlineCursor
cs-u0 = ResourceBindingDiagnosticText
dispatch = 1, 1, 1
post cs-t0 = null
post cs-t1 = null
post cs-t2 = null
post cs-t3 = null
post cs-t4 = null
post cs-t5 = null
post cs-t6 = null
post cs-u0 = null
post x121 = $back_x121
post y121 = $back_y121
post z121 = $back_z121
post w121 = $back_w121

