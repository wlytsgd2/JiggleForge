; Captures the actual inputs left by the Mod's own Skin override. No role hashes.
[ShaderOverrideBindingWeightSkin]
hash = e8425f64cfb887cd
allow_duplicate_hash = true
if $runtimeEnabled == 1 && DRAW_TYPE == 1
    ResourceBindingSkinSO = ref so0
    $bindingSkinCandidate = 1
endif
post run = CommandListBindingEndSkin

[CommandListBindingEndSkin]
if $bindingSkinCandidate == 1
    local $key = @ResourceBindingSkinSO
    if $key && vb0->Stride == 40 && vb2->Stride == 32 && vb0->Offset == 0 && vb2->Offset == 0 && vb0->Size * 32 == vb2->Size * 40 && ResourceBindingSkinSO->Size >= vb0->Size
        ; Keep the SO alive while its cached binding is addressable. The next
        ; render frame may reuse it without running animation/skin again.
        if @PoolBindingOwner[$key] != $key
            PoolBindingOwner[$key] = ref ResourceBindingSkinSO
        endif
        local $changed = $PoolBindingSource[$key] != @vb2
        if $changed
            PoolBindingSource[$key] = ref vb2
            $PoolBindingSource[$key] = @vb2
            $PoolBindingMode[$key] = -1
            PoolBindingBlend[$key] = null
            PoolBindingTyped[$key] = null
        endif
        ; Registration only, even while asleep: retain original resources so
        ; a static model can wake without waiting for skin to run again.
        ; View creation and copies are deferred until motion is actually needed.
    else
        PoolBindingOwner[$key] = null
        PoolBindingSource[$key] = null
        $PoolBindingSource[$key] = 0
        PoolBindingBlend[$key] = null
        PoolBindingTyped[$key] = null
    endif
endif
$bindingSkinCandidate = 0
ResourceBindingSkinSO = null

[PoolBindingBlend]
pool_size = 128
pool_index_type = fifo
pool_element_type_switch_reset = 0
type = StructuredBuffer
format = UNKNOWN
stride = 32
bind_flags = shader_resource

[PoolBindingTyped]
pool_size = 128
pool_index_type = fifo
type = Buffer
format = R32G32B32A32_UINT
stride = 16
bind_flags = shader_resource

[PoolBindingSource]
pool_size = 128
pool_index_type = fifo
pool_element_type_switch_reset = 0

[PoolBindingMode]
pool_size = 128
pool_index_type = fifo
pool_variable_default_value = -1

[PoolBindingResolveFrame]
pool_size = 128
pool_index_type = fifo
pool_variable_default_value = -1

[PoolBindingFrame]
pool_size = 128
pool_index_type = fifo
pool_variable_default_value = -1

[PoolBindingOwner]
pool_size = 128
pool_index_type = fifo

[ResourceBindingSkinSO]
[ResourceBindingSavedProbe]
[ResourceBindingTryTyped]
type = Buffer
format = R32G32B32A32_UINT
stride = 16
[ResourceBindingTryStructured]
type = StructuredBuffer
format = UNKNOWN
stride = 32
[ResourceBindingTypedPositions]
type = Buffer
format = R32_FLOAT
stride = 4
[ResourceBindingStructuredPositions]
type = StructuredBuffer
format = UNKNOWN
stride = 40
[ResourceBindingPositions]
type = StructuredBuffer
format = UNKNOWN
stride = 40
bind_flags = shader_resource

[ResourceBindingCaptures]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 5120
bind_flags = unordered_access shader_resource

[ResourceBindingNearest]
type = RWBuffer
format = R32_UINT
array = 2
bind_flags = unordered_access shader_resource

[ResourceBindingDispatchArgs]
type = RWBuffer
format = R32_UINT
array = 6
bind_flags = unordered_access shader_resource
; dispatchindirect automatically adds the DRAWINDIRECT_ARGS misc flag.

[CommandListBindingPrepareViews]
; Called only during dragging / release, never by dormant skin registration.
if $PoolBindingMode[$bindingKey] < 0
    $PoolBindingMode[$bindingKey] = 2
    if PoolBindingSource[$bindingKey]->BindFlags % 16 >= 8
        ResourceBindingSavedProbe = ref cs-t6
        ResourceBindingTryTyped = ref PoolBindingSource[$bindingKey]
        cs-t6 = null
        cs-t6 = ResourceBindingTryTyped
        if @cs-t6 == $PoolBindingSource[$bindingKey]
            PoolBindingTyped[$bindingKey] = ref ResourceBindingTryTyped
            $PoolBindingMode[$bindingKey] = 1
        else
            ResourceBindingTryStructured = ref PoolBindingSource[$bindingKey]
            cs-t6 = null
            cs-t6 = ResourceBindingTryStructured
            if @cs-t6 == $PoolBindingSource[$bindingKey]
                PoolBindingBlend[$bindingKey] = ref ResourceBindingTryStructured
                $PoolBindingMode[$bindingKey] = 0
            endif
        endif
        cs-t6 = ResourceBindingSavedProbe
        ResourceBindingSavedProbe = null
        ResourceBindingTryTyped = null
        ResourceBindingTryStructured = null
    endif
endif
if $PoolBindingMode[$bindingKey] == 2 && (@PoolBindingBlend[$bindingKey] == 0 || $PoolBindingFrame[$bindingKey] != $bindingFrame)
    PoolBindingBlend[$bindingKey] = copy PoolBindingSource[$bindingKey]
    $PoolBindingFrame[$bindingKey] = $bindingFrame
endif

[CommandListBindingBeginDraw]
$bindingKey = @vb0
x113 = 0
y113 = 0
z113 = 0
w113 = 0
x114 = 0
y114 = 0
w114 = 0
vs-t79 = null
vs-t80 = null
vs-t81 = null
; Bone binding describes the mesh, not a frame's temporary SO/CB allocation.
; Reuse the owned snapshot on skipped skin frames. A newly skinned or changed
; stream updates/invalidate its mapping above; unknown SOs still fail closed.
if $bindingKey && @PoolBindingOwner[$bindingKey] == $bindingKey && $PoolBindingSource[$bindingKey] != 0 && vb0->Stride == 40
    x113 = $PoolBindingSource[$bindingKey]
    y113 = PoolBindingSource[$bindingKey]->Size / 32
    z113 = 3
    w113 = 0
    x114 = vb0->Offset / 40
    if $demandMotionActive == 1 && $boneWeightEnabled == 1
        run = CommandListBindingPrepareViews
    endif
    if $PoolBindingMode[$bindingKey] == 1
        y114 = 1
    endif
    if $demandMotionActive == 1 && $boneWeightEnabled == 1 && $bindingResolveFrames > 0 && $bindingCanResolve == 1 && $PoolBindingResolveFrame[$bindingKey] != $bindingFrame
        $PoolBindingResolveFrame[$bindingKey] = $bindingFrame
        ResourceBindingStructuredPositions = null
        ResourceBindingTypedPositions = null
        local $readable = 0
        if vb0->BindFlags % 16 >= 8
            ResourceBindingSavedProbe = ref cs-t6
            ResourceBindingTypedPositions = ref vb0
            cs-t6 = null
            cs-t6 = ResourceBindingTypedPositions
            if @cs-t6 == @vb0
                w114 = 1
                $readable = 1
            else
                ResourceBindingTypedPositions = null
                ResourceBindingStructuredPositions = ref vb0
                cs-t6 = null
                cs-t6 = ResourceBindingStructuredPositions
                if @cs-t6 == @vb0
                    $readable = 1
                endif
            endif
            cs-t6 = ResourceBindingSavedProbe
            ResourceBindingSavedProbe = null
        endif
        if $readable == 0
            ResourceBindingPositions = copy vb0
            ResourceBindingStructuredPositions = ref ResourceBindingPositions
        endif
        ; GPU checks the pending capture and emits zero dispatch counts as soon
        ; as it is resolved. No synchronous store/readback to the CPU.
        run = CustomShaderBindingClear
        run = CustomShaderBindingDistance
        run = CustomShaderBindingIndex
        run = CustomShaderBindingResolve
    endif
    if $demandMotionActive == 1 && $boneWeightEnabled == 1
        if $PoolBindingMode[$bindingKey] == 1
            vs-t80 = PoolBindingTyped[$bindingKey]
        else
            vs-t79 = PoolBindingBlend[$bindingKey]
        endif
    endif
endif
if $demandMotionActive == 1 && $boneWeightEnabled == 1
    vs-t81 = ResourceBindingCaptures
endif

[CustomShaderBindingClear]
cs = ./JiggleForge/runtime/binding_clear_cs.hlsl
cs-t0 = ResourceCapturedPick
cs-t1 = ResourceBindingCaptures
cs-u0 = ResourceBindingNearest
cs-u1 = ResourceBindingDispatchArgs
dispatch = 1, 1, 1
post cs-t0 = null
post cs-t1 = null
post cs-u0 = null
post cs-u1 = null

[CustomShaderBindingDistance]
cs = ./JiggleForge/runtime/binding_distance_cs.hlsl
cs-t0 = ResourceCapturedPick
cs-t1 = ResourceBindingCaptures
cs-t2 = ResourceBindingStructuredPositions
cs-t3 = PoolBindingBlend[$bindingKey]
cs-t4 = ResourceBindingTypedPositions
cs-t5 = PoolBindingTyped[$bindingKey]
cs-cb0 = ref vs-cb1->Region(vs-cb1->Offset, vs-cb1->Size)
cs-u0 = ResourceBindingNearest
dispatchindirect = ResourceBindingDispatchArgs, 0
post cs-t0 = null
post cs-t1 = null
post cs-t2 = null
post cs-t3 = null
post cs-t4 = null
post cs-t5 = null
post cs-u0 = null
post cs-cb0 = null

[CustomShaderBindingIndex]
cs = ./JiggleForge/runtime/binding_index_cs.hlsl
cs-t0 = ResourceCapturedPick
cs-t1 = ResourceBindingCaptures
cs-t2 = ResourceBindingStructuredPositions
cs-t3 = PoolBindingBlend[$bindingKey]
cs-t4 = ResourceBindingTypedPositions
cs-t5 = PoolBindingTyped[$bindingKey]
cs-cb0 = ref vs-cb1->Region(vs-cb1->Offset, vs-cb1->Size)
cs-u0 = ResourceBindingNearest
dispatchindirect = ResourceBindingDispatchArgs, 0
post cs-t0 = null
post cs-t1 = null
post cs-t2 = null
post cs-t3 = null
post cs-t4 = null
post cs-t5 = null
post cs-u0 = null
post cs-cb0 = null

[CustomShaderBindingResolve]
cs = ./JiggleForge/runtime/binding_resolve_cs.hlsl
cs-t0 = ResourceCapturedPick
cs-t1 = ResourceBindingNearest
cs-t2 = PoolBindingBlend[$bindingKey]
cs-t3 = PoolBindingTyped[$bindingKey]
cs-cb0 = ref vs-cb1->Region(vs-cb1->Offset, vs-cb1->Size)
cs-u0 = ResourceBindingCaptures
dispatchindirect = ResourceBindingDispatchArgs, 12
post cs-t0 = null
post cs-t1 = null
post cs-t2 = null
post cs-t3 = null
post cs-u0 = null
post cs-cb0 = null
